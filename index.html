<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘 뭐 먹지? 🍽️</title>
  <style>
    :root {
      --cream: #fff8e7;
      --cream-dark: #fbecc8;
      --orange: #ff8a3d;
      --orange-dark: #e86a1c;
      --orange-light: #ffe2cc;
      --text: #4a3424;
      --text-soft: #8a6d58;
      --white: #ffffff;
      --shadow: 0 6px 18px rgba(232, 106, 28, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    body {
      background: var(--cream);
      color: var(--text);
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
      line-height: 1.5;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 2rem;
      color: var(--orange-dark);
    }

    header p {
      margin: 6px 0 0;
      color: var(--text-soft);
    }

    /* 조건 묶음 카드 */
    .group {
      background: var(--white);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      border: none;
      min-width: 0;
    }

    .group legend {
      float: left;
      width: 100%;
      padding: 0;
      margin-bottom: 10px;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .options {
      clear: both;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* 라디오 버튼을 둥근 칩 모양으로 */
    .chip input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .chip span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 44px;
      padding: 8px 16px;
      border-radius: 999px;
      border: 2px solid var(--orange-light);
      background: var(--cream);
      font-size: 0.95rem;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }

    .chip span:hover {
      border-color: var(--orange);
    }

    .chip input:checked + span {
      background: var(--orange);
      border-color: var(--orange);
      color: var(--white);
      font-weight: 700;
    }

    .chip input:checked + span::before {
      content: "✓";
    }

    .chip input:focus-visible + span {
      outline: 3px solid var(--orange-dark);
      outline-offset: 2px;
    }

    /* 버튼 */
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0;
    }

    button {
      font: inherit;
      min-height: 52px;
      border-radius: 999px;
      border: none;
      padding: 12px 20px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-main {
      flex: 1 1 100%;
      background: var(--orange);
      color: var(--white);
      font-size: 1.1rem;
      box-shadow: var(--shadow);
    }

    .btn-main:hover {
      background: var(--orange-dark);
    }

    .btn-sub {
      flex: 1 1 0;
      background: var(--white);
      color: var(--orange-dark);
      border: 2px solid var(--orange);
    }

    .btn-sub:hover {
      background: var(--orange-light);
    }

    .btn-sub:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    /* 결과 카드 */
    .result {
      background: var(--white);
      border-radius: 24px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: var(--shadow);
      border: 3px dashed var(--orange-light);
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .result .emoji {
      font-size: 4.5rem;
      line-height: 1.1;
    }

    .result .name {
      margin: 8px 0 4px;
      font-size: 1.6rem;
      color: var(--orange-dark);
      word-break: keep-all;
    }

    .result .desc {
      margin: 0 0 14px;
      color: var(--text-soft);
      word-break: keep-all;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .tag {
      background: var(--cream-dark);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.95rem;
    }

    .notice {
      margin-top: 14px;
      background: var(--orange-light);
      color: var(--orange-dark);
      border-radius: 14px;
      padding: 8px 14px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .message {
      font-size: 1.05rem;
      word-break: keep-all;
    }

    .message .big {
      font-size: 3rem;
      display: block;
      margin-bottom: 6px;
    }

    .pop {
      animation: pop 0.35s ease-out;
    }

    @keyframes pop {
      0% { transform: scale(0.9); opacity: 0.4; }
      100% { transform: scale(1); opacity: 1; }
    }

    .disclaimer {
      margin-top: 16px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-soft);
    }

    @media (max-width: 380px) {
      header h1 { font-size: 1.7rem; }
      .chip span { padding: 8px 12px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>오늘 뭐 먹지? 🍽️</h1>
      <p>조건을 고르면 점심 메뉴를 골라 드려요!</p>
    </header>

    <form id="conditions" onsubmit="return false;">
      <fieldset class="group">
        <legend>🍱 음식 종류</legend>
        <div class="options">
          <label class="chip"><input type="radio" name="category" value="전체" checked /><span>전체</span></label>
          <label class="chip"><input type="radio" name="category" value="한식" /><span>한식</span></label>
          <label class="chip"><input type="radio" name="category" value="중식" /><span>중식</span></label>
          <label class="chip"><input type="radio" name="category" value="일식" /><span>일식</span></label>
          <label class="chip"><input type="radio" name="category" value="양식" /><span>양식</span></label>
          <label class="chip"><input type="radio" name="category" value="분식" /><span>분식</span></label>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend>💰 최대 예산</legend>
        <div class="options">
          <label class="chip"><input type="radio" name="budget" value="0" checked /><span>제한 없음</span></label>
          <label class="chip"><input type="radio" name="budget" value="8000" /><span>8,000원</span></label>
          <label class="chip"><input type="radio" name="budget" value="10000" /><span>10,000원</span></label>
          <label class="chip"><input type="radio" name="budget" value="15000" /><span>15,000원</span></label>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend>🌶️ 매운 정도</legend>
        <div class="options">
          <label class="chip"><input type="radio" name="spicy" value="상관없음" checked /><span>상관없음</span></label>
          <label class="chip"><input type="radio" name="spicy" value="0" /><span>안 매운 음식</span></label>
          <label class="chip"><input type="radio" name="spicy" value="1" /><span>살짝 매운 음식</span></label>
          <label class="chip"><input type="radio" name="spicy" value="2" /><span>매운 음식</span></label>
        </div>
      </fieldset>
    </form>

    <div class="buttons">
      <button type="button" class="btn-main" id="recommendBtn">🍀 점심 메뉴 추천받기</button>
      <button type="button" class="btn-sub" id="retryBtn" disabled>🔄 다시 추천</button>
      <button type="button" class="btn-sub" id="resetBtn">↩️ 조건 초기화</button>
    </div>

    <section class="result" id="result" aria-live="polite"></section>

    <p class="disclaimer">※ 가격은 실습용 예시 금액이며 실제 식당 가격과 다를 수 있어요.</p>
  </main>

  <script>
    // =====================================================================
    // 🍽️ 메뉴 데이터 목록
    // ---------------------------------------------------------------------
    // ✏️ 메뉴를 추가하거나 수정하려면 아래 목록(MENUS)을 고치면 돼요!
    //   - name     : 메뉴 이름
    //   - category : 음식 종류 ("한식", "중식", "일식", "양식", "분식" 중 하나)
    //   - emoji    : 음식 이모지
    //   - desc     : 짧은 설명
    //   - price    : 예상 가격 (숫자, 원 단위, 쉼표 없이 작성)
    //   - spicy    : 매운 정도 (0 = 안 매움, 1 = 살짝 매움, 2 = 매움)
    //
    // 예) 새 메뉴 추가하기 — 아래 줄을 복사해서 목록 안에 붙여 넣고 내용을 바꿔요.
    //   { name: "콩국수", category: "한식", emoji: "🥣", desc: "고소하고 시원한 여름 국수", price: 9000, spicy: 0 },
    // =====================================================================
    const MENUS = [
      // ----- 🍚 한식 -----
      { name: "비빔밥", category: "한식", emoji: "🍚", desc: "갖가지 나물과 고추장을 슥슥 비벼 먹는 한 그릇", price: 9000, spicy: 1 },
      { name: "김치찌개", category: "한식", emoji: "🍲", desc: "푹 익은 김치와 돼지고기가 들어간 얼큰한 찌개", price: 8000, spicy: 2 },
      { name: "된장찌개", category: "한식", emoji: "🥘", desc: "구수한 된장에 두부와 애호박이 듬뿍", price: 7500, spicy: 0 },
      { name: "불고기 정식", category: "한식", emoji: "🥩", desc: "달콤 짭짤한 양념 소불고기와 밥 한 상", price: 12000, spicy: 0 },
      { name: "제육볶음", category: "한식", emoji: "🍖", desc: "매콤한 고추장 양념에 볶은 돼지고기", price: 9500, spicy: 2 },
      { name: "삼계탕", category: "한식", emoji: "🐔", desc: "인삼과 찹쌀을 넣고 푹 고은 든든한 보양식", price: 16000, spicy: 0 },

      // ----- 🥟 중식 -----
      { name: "짜장면", category: "중식", emoji: "🍜", desc: "달콤한 춘장 소스를 듬뿍 얹은 국민 면 요리", price: 7000, spicy: 0 },
      { name: "짬뽕", category: "중식", emoji: "🌶️", desc: "해물과 채소가 가득한 얼큰한 빨간 국물", price: 9000, spicy: 2 },
      { name: "볶음밥", category: "중식", emoji: "🍳", desc: "불맛 나는 고슬고슬 볶음밥과 짜장 소스", price: 8000, spicy: 0 },
      { name: "탕수육", category: "중식", emoji: "🍤", desc: "바삭한 튀김에 새콤달콤 소스를 곁들여요", price: 18000, spicy: 0 },
      { name: "마라탕", category: "중식", emoji: "🥵", desc: "얼얼하고 화끈한 마라 국물에 좋아하는 재료를 쏙", price: 13000, spicy: 2 },
      { name: "마파두부밥", category: "중식", emoji: "🥢", desc: "살짝 매콤한 두부 소스를 밥에 쓱쓱", price: 9500, spicy: 1 },

      // ----- 🍣 일식 -----
      { name: "초밥 세트", category: "일식", emoji: "🍣", desc: "신선한 생선을 올린 모둠 초밥", price: 15000, spicy: 0 },
      { name: "돈카츠", category: "일식", emoji: "🍛", desc: "겉은 바삭, 속은 촉촉한 두툼한 돈카츠", price: 11000, spicy: 0 },
      { name: "라멘", category: "일식", emoji: "🍜", desc: "진한 돼지뼈 육수에 차슈를 올린 라멘", price: 10000, spicy: 0 },
      { name: "매운 라멘", category: "일식", emoji: "🔥", desc: "고추기름이 동동 뜬 화끈한 라멘", price: 11000, spicy: 2 },
      { name: "규동", category: "일식", emoji: "🍚", desc: "달큰하게 졸인 소고기를 밥 위에 듬뿍", price: 8000, spicy: 0 },
      { name: "카레 우동", category: "일식", emoji: "🍲", desc: "쫄깃한 우동면에 살짝 매콤한 카레 국물", price: 9000, spicy: 1 },

      // ----- 🍝 양식 -----
      { name: "크림 파스타", category: "양식", emoji: "🍝", desc: "부드럽고 고소한 크림 소스 파스타", price: 13000, spicy: 0 },
      { name: "아라비아따 파스타", category: "양식", emoji: "🌶️", desc: "페페론치노로 매콤하게 맛을 낸 토마토 파스타", price: 12500, spicy: 2 },
      { name: "피자 한 조각 세트", category: "양식", emoji: "🍕", desc: "치즈가 쭉 늘어나는 피자와 음료 세트", price: 7500, spicy: 0 },
      { name: "수제 햄버거", category: "양식", emoji: "🍔", desc: "두툼한 패티와 감자튀김이 함께 나오는 세트", price: 10000, spicy: 0 },
      { name: "치킨 샐러드", category: "양식", emoji: "🥗", desc: "구운 닭가슴살을 올린 가볍고 상큼한 샐러드", price: 9000, spicy: 0 },
      { name: "스테이크 덮밥", category: "양식", emoji: "🥩", desc: "살짝 매콤한 소스를 곁들인 스테이크 덮밥", price: 15000, spicy: 1 },

      // ----- 🍢 분식 -----
      { name: "떡볶이", category: "분식", emoji: "🍢", desc: "쫄깃한 떡에 매콤달콤한 빨간 양념", price: 5000, spicy: 2 },
      { name: "김밥", category: "분식", emoji: "🍙", desc: "알록달록 속재료를 꽉 채운 김밥 한 줄", price: 4000, spicy: 0 },
      { name: "라볶이", category: "분식", emoji: "🍜", desc: "떡볶이 양념에 라면 사리를 더한 꿀조합", price: 6500, spicy: 1 },
      { name: "쫄면", category: "분식", emoji: "🥢", desc: "새콤하고 매콤한 양념에 쫄깃한 면", price: 6000, spicy: 2 },
      { name: "돈가스 김밥 세트", category: "분식", emoji: "🍱", desc: "바삭한 돈가스 김밥과 어묵국 세트", price: 8500, spicy: 0 },
      { name: "치즈 라면", category: "분식", emoji: "🧀", desc: "살짝 매콤한 라면에 치즈를 사르르", price: 5500, spicy: 1 },
    ];
    // ===================== ⬆️ 메뉴 목록은 여기까지 ⬆️ =====================

    // 매운 정도 숫자를 화면에 보여 줄 글자로 바꿔요.
    const SPICY_LABELS = {
      0: "😊 안 매움",
      1: "🌶️ 살짝 매움",
      2: "🌶️🌶️ 매움",
    };

    const form = document.getElementById("conditions");
    const resultBox = document.getElementById("result");
    const recommendBtn = document.getElementById("recommendBtn");
    const retryBtn = document.getElementById("retryBtn");
    const resetBtn = document.getElementById("resetBtn");

    // 직전에 추천한 메뉴 (다시 추천할 때 제외하기 위해 기억해요)
    let lastMenu = null;

    // 현재 선택된 조건 읽기
    function getConditions() {
      return {
        category: form.category.value,
        budget: Number(form.budget.value), // 0이면 예산 제한 없음
        spicy: form.spicy.value,
      };
    }

    // 조건을 모두 만족하는 메뉴만 골라내기
    function filterMenus(cond) {
      return MENUS.filter((menu) => {
        const categoryOk = cond.category === "전체" || menu.category === cond.category;
        const budgetOk = cond.budget === 0 || menu.price <= cond.budget;
        const spicyOk = cond.spicy === "상관없음" || menu.spicy === Number(cond.spicy);
        return categoryOk && budgetOk && spicyOk;
      });
    }

    function pickRandom(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function formatPrice(price) {
      return price.toLocaleString("ko-KR") + "원";
    }

    function showMessage(emoji, text) {
      resultBox.innerHTML = "";
      const p = document.createElement("p");
      p.className = "message pop";
      const big = document.createElement("span");
      big.className = "big";
      big.textContent = emoji;
      p.append(big, text);
      resultBox.appendChild(p);
    }

    function showMenu(menu, notice) {
      resultBox.innerHTML = `
        <div class="pop">
          <div class="emoji"></div>
          <h2 class="name"></h2>
          <p class="desc"></p>
          <div class="tags">
            <span class="tag price"></span>
            <span class="tag spicy"></span>
          </div>
        </div>`;
      resultBox.querySelector(".emoji").textContent = menu.emoji;
      resultBox.querySelector(".name").textContent = menu.name;
      resultBox.querySelector(".desc").textContent = menu.desc;
      resultBox.querySelector(".price").textContent = "💰 약 " + formatPrice(menu.price);
      resultBox.querySelector(".spicy").textContent = SPICY_LABELS[menu.spicy];
      if (notice) {
        const n = document.createElement("div");
        n.className = "notice";
        n.textContent = notice;
        resultBox.firstElementChild.appendChild(n);
      }
    }

    // 추천하기 (excludeLast가 true면 직전 메뉴는 빼고 골라요)
    function recommend(excludeLast) {
      const candidates = filterMenus(getConditions());

      if (candidates.length === 0) {
        lastMenu = null;
        retryBtn.disabled = true;
        showMessage("🥲", "조건에 맞는 메뉴가 없어요. 예산이나 다른 조건을 바꿔보세요.");
        return;
      }

      if (candidates.length === 1) {
        lastMenu = candidates[0];
        retryBtn.disabled = false;
        showMenu(lastMenu, "조건에 맞는 메뉴가 하나예요.");
        return;
      }

      let pool = candidates;
      if (excludeLast && lastMenu) {
        pool = candidates.filter((menu) => menu !== lastMenu);
      }
      lastMenu = pickRandom(pool);
      retryBtn.disabled = false;
      showMenu(lastMenu);
    }

    function showWelcome() {
      showMessage("🍽️", "조건을 고르고 ‘점심 메뉴 추천받기’를 눌러 보세요!");
    }

    recommendBtn.addEventListener("click", () => recommend(false));
    retryBtn.addEventListener("click", () => recommend(true));

    // 조건이 바뀌면 이전 결과를 지우고 안내해요.
    form.addEventListener("change", () => {
      lastMenu = null;
      retryBtn.disabled = true;
      showMessage("🔁", "조건이 바뀌었어요. 다시 추천받아 보세요.");
    });

    // 조건 초기화: 기본 선택(전체 · 제한 없음 · 상관없음)으로 돌아가요.
    resetBtn.addEventListener("click", () => {
      form.reset(); // HTML에 checked로 표시한 기본값으로 돌아가요.
      lastMenu = null;
      retryBtn.disabled = true;
      showWelcome();
    });

    showWelcome();
  </script>
</body>
</html>
